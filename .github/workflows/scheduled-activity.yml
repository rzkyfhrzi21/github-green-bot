name: Scheduled Activity

on:
  schedule:
    # Temporary probe at the minimum supported interval. Replace after verification.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-activity
  cancel-in-progress: false

jobs:
  record-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6

      - name: Record daily activity
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail

          date_now="$(TZ=Asia/Jakarta date +%F)"
          year_now="$(TZ=Asia/Jakarta date +%Y)"
          month_now="$(TZ=Asia/Jakarta date +%m)"
          git config user.name "$GH_ACTOR"
          git config user.email "${GH_ACTOR_ID}+${GH_ACTOR}@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"

          for commit_number in $(seq 1 15); do
            time_now="$(TZ=Asia/Jakarta date '+%H:%M:%S WIB')"
            time_slug="$(TZ=Asia/Jakarta date +%H-%M-%S)"
            activity_file="activity/${year_now}/${month_now}/${date_now}/${time_slug}-${GITHUB_RUN_ID}-${commit_number}.md"

            mkdir -p "$(dirname "$activity_file")"
            printf '# Activity %s\n\n- Recorded automatically at %s (commit %s of 15).\n' \
              "$date_now" "$time_now" "$commit_number" > "$activity_file"

            git add "$activity_file"
            git commit -m "chore: record activity ${commit_number}/15 for ${date_now}"
          done

          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; rebasing onto the latest branch."
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep $((attempt * 2))
          done

          echo "Push failed after 3 attempts."
          exit 1
